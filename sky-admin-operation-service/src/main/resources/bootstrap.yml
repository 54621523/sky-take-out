server:
  port: 8200

spring:
  application:
    name: sky-admin-operation-service
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        shared-configs:
          - data-id: common-datasource.yaml
          - data-id: common-dubbo.yaml
          - data-id: common-log.yaml
          - data-id: common-sentinel.yaml
      discovery:
        server-addr: 127.0.0.1:8848
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
